name: Check static site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: 'Optional commit SHA to compare unchanged content and layout against'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Verify checked-in generated assets
        run: git diff --exit-code -- assets
      - run: npx playwright install --with-deps chromium
      - name: Prepare original site for visual comparison
        env:
          BASE_REF: 1c5c9f53add46edbacf5ce63aa79c244f906ba91
        run: |
          BASE_SHA=$(git rev-parse --verify --end-of-options "$BASE_REF^{commit}")
          git worktree add --detach ../baseline "$BASE_SHA"
      - name: Verify the regression test rejects the original theme timing
        run: |
          cp index.html "$RUNNER_TEMP/fixed-index.html"
          trap 'cp "$RUNNER_TEMP/fixed-index.html" index.html' EXIT
          git show 1c5c9f53add46edbacf5ce63aa79c244f906ba91:index.html > index.html
          if npm run test:browser > "$RUNNER_TEMP/initial-theme-regression.log" 2>&1; then
            cat "$RUNNER_TEMP/initial-theme-regression.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/initial-theme-regression.log"
          grep -F 'Theme must be applied before styles: 390px, light system, stored dark' "$RUNNER_TEMP/initial-theme-regression.log"
      - name: Check layouts and interactions
        env:
          BASELINE_ROOT: ../baseline
          SCREENSHOT_DIR: .qa/screenshots
        run: npm run test:browser
      - name: Verify desktop and mobile screenshots are unchanged
        run: |
          node <<'JS'
          const assert = require('node:assert/strict');
          const sharp = require('sharp');
          (async () => {
            for (const label of ['390-light', '390-dark', '1440-light', '1440-dark']) {
              const before = await sharp(`.qa/screenshots/${label}-before.png`).raw().toBuffer({ resolveWithObject: true });
              const after = await sharp(`.qa/screenshots/${label}-after.png`).raw().toBuffer({ resolveWithObject: true });
              assert.deepEqual(after.info, before.info, label);
              assert(after.data.equals(before.data), `Pixels changed: ${label}`);
              console.log(`Pixel-identical before/after: ${label}`);
            }
          })().catch((error) => { console.error(error); process.exitCode = 1; });
          JS
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: layout-screenshots
          path: .qa/screenshots
          if-no-files-found: ignore
